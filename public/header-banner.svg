<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Abstract blue and violet gradient</title>
  <desc id="desc">A dark, abstract field of cobalt, violet, and cyan light for A Lazy Engineer.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c1e" />
      <stop offset="0.5" stop-color="#17133a" />
      <stop offset="1" stop-color="#071b2d" />
    </linearGradient>
    <radialGradient id="violet" cx="0.2" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#9c5cff" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#5e3ec8" stop-opacity="0.36" />
      <stop offset="1" stop-color="#5e3ec8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue" cx="0.82" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#2d9cff" stop-opacity="0.85" />
      <stop offset="0.52" stop-color="#2167d2" stop-opacity="0.25" />
      <stop offset="1" stop-color="#2167d2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan" cx="0.66" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#20d9e6" stop-opacity="0.58" />
      <stop offset="0.52" stop-color="#138da8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#138da8" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-xl" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="blur-lg" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.07" />
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1600" height="420" fill="url(#base)" />
  <ellipse cx="250" cy="65" rx="430" ry="220" fill="url(#violet)" filter="url(#blur-xl)" />
  <ellipse cx="1320" cy="90" rx="460" ry="250" fill="url(#blue)" filter="url(#blur-xl)" />
  <ellipse cx="1080" cy="450" rx="520" ry="180" fill="url(#cyan)" filter="url(#blur-lg)" />
  <path d="M-80 350C280 120 530 160 820 250s530 80 860-160" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2" />
  <path d="M-120 385C250 155 520 190 810 275s520 80 900-145" fill="none" stroke="url(#sheen)" stroke-width="1" />
  <rect width="1600" height="420" fill="url(#grid)" opacity="0.65" />
  <rect width="1600" height="420" fill="url(#base)" opacity="0.12" />
</svg>
